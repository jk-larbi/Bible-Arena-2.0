name: Validate Staged Bible Rebuild Batches

on:
  push:
    branches:
      - hosting/cloudflare-github-pages
    paths:
      - 'src/data/rebuild/**'
      - 'scripts/validateRebuildBatches.ts'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  staged-batch-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BibleArena
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate staged questions across games
        run: bun run validate:rebuild
