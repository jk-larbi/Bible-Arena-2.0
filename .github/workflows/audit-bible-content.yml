name: Bible Content Quality Audit

on:
  push:
    branches:
      - hosting/cloudflare-github-pages
    paths:
      - 'src/data/bibleContentBank.ts'
      - 'scripts/validateContent.ts'
      - 'package.json'
      - '.github/workflows/audit-bible-content.yml'
  pull_request:
    branches:
      - hosting/cloudflare-github-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BibleArena
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install
      - name: Audit all 4,750 question slots
        run: npm run validate:content
