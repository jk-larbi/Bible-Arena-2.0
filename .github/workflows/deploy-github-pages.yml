name: Deploy BibleArena to GitHub Pages

on:
  push:
    branches:
      - hosting/cloudflare-github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hosting branch
        uses: actions/checkout@v4
        with:
          ref: hosting/cloudflare-github-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Test quiz accuracy and scoring
        run: npm run test:quiz
      - name: Verify all 50 levels and game mechanics
        run: npm run test:all-levels

      - name: Validate staged Bible rebuild batches
        run: npm run validate:rebuild

      - name: Test multiplayer and 19-game catalogue
        run: npm run test:multiplayer

      - name: Optimize game artwork and logo
        run: node scripts/optimizeImages.mjs

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /Bible-Arena-2.0/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
