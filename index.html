    <title>BibleArena 2.0 - Multiplayer Bible Gaming Platform</title>
    <script>
      // Restore deep links after GitHub Pages serves the SPA fallback (404.html).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (!redirectPath) return;
        params.delete('p');
        var remainingQuery = params.toString();
        var restoredUrl = '/Bible-Arena-2.0' + (redirectPath.startsWith('/') ? redirectPath : '/' + redirectPath);
        if (remainingQuery) restoredUrl += '?' + remainingQuery;
        window.history.replaceState(null, '', restoredUrl);
      })();
    </script>
